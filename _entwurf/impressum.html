<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Impressum · MC Projekt 2026</title>
<link rel="icon" href="favicon.png" type="image/png">
<!--
  ENTWURF, NICHT VERÖFFENTLICHT.
  Ordner, die mit einem Unterstrich beginnen, veröffentlicht GitHub Pages nicht.
  Nur verwenden, wenn du dich für ein Impressum entscheidest (siehe Prüfbericht):
  1. Platzhalter in eckigen Klammern ausfüllen
  2. Datei in den Hauptordner verschieben (impressum.html)
  3. Im Footer von index.html und datenschutz.html den Link auf impressum.html ergänzen
-->
<style>
@font-face{font-family:"Pixelify Sans";font-weight:700;font-display:swap;src:url("fonts/pixelify-sans-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";font-weight:400;font-display:swap;src:url("fonts/instrument-sans-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";font-weight:600;font-display:swap;src:url("fonts/instrument-sans-latin-600-normal.woff2") format("woff2")}
:root{--bg:#eef0ea;--line:#cdd3c6;--fg:#1c2119;--muted:#5c6656;--ember:#c4521b}
@media (prefers-color-scheme: dark){:root{--bg:#14171a;--line:#343a40;--fg:#e8ebe4;--muted:#9aa395;--ember:#f07a3e;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:16px;padding-block:40px 64px}
main{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1{font-family:"Pixelify Sans","Courier New",monospace;font-size:clamp(2rem,6vw,2.8rem);line-height:1.1;margin:0}
h2{font-size:1.1rem;margin:0 0 6px}
p{margin:0;color:var(--muted)}
section{border-top:1px solid var(--line);padding-top:18px}
a{color:var(--ember);font-weight:600}
.back{text-decoration:none}
</style>
</head>
<body>
<main>
  <a class="back" href="./">← Zurück zur Seite</a>
  <h1>Impressum</h1>
  <section>
    <h2>Angaben gemäß § 18 Abs. 1 MStV</h2>
    <p>David Geisler<br>[STRASSE UND HAUSNUMMER]<br>[POSTLEITZAHL] [ORT]</p>
  </section>
  <section>
    <h2>Kontakt</h2>
    <p>E-Mail: [E-MAIL-ADRESSE]</p>
  </section>
  <section>
    <h2>Hinweis</h2>
    <p>Privates, nicht kommerzielles Fanprojekt ohne Werbung und ohne Einnahmen. Kein offizielles Angebot von Mojang oder Microsoft.</p>
  </section>
</main>
</body>
</html>
