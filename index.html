<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meine Seite</title>
<style>
  :root {
    --bg: #f6f4ef;
    --fg: #1d1d1b;
    --muted: #6b6a66;
    --accent: #2f6f4e;
    --card: #ffffff;
    --line: #e4e1d8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141513;
      --fg: #ecebe6;
      --muted: #9a9993;
      --accent: #7fc4a0;
      --card: #1d1f1c;
      --line: #2c2e2a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  main {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 40px 32px;
  }
  .tag {
    display: inline-block;
    font-size: 13px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }
  h1 { font-size: 34px; line-height: 1.15; margin: 0 0 12px; }
  p { margin: 0 0 16px; color: var(--muted); }
  footer {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 14px;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <span class="tag">Im Aufbau</span>
  <h1>Willkommen auf meiner Seite</h1>
  <p>Hier entsteht gerade etwas Neues. Schau bald wieder vorbei.</p>
  <footer>© <span id="y"></span> David</footer>
</main>
<script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
